<!doctype html><meta charset="utf-8"><title>32:64 across seeds</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * Is 32:64 broken, or is it high variance sampled once?
 *
 * At 32 clusters the draw decides which 32 of 8,076 rows the model sees, and a
 * shallow alignment makes that choice matter. Every depth measured so far used
 * seed 0. One number per depth cannot tell a bug from a bad draw.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);
const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const { mergeChainA3ms } = await src('src/input/chains.js');
const CHAIN = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const LENGTHS = [CHAIN.length, CHAIN.length];
const SEEDS = [0, 1, 2, 3, 4];
try {
  const device = await getDevice();
  const a3m = await fetch('/test.a3m').then((r) => r.text());
  const merged = mergeChainA3ms([a3m, a3m]);
  for (const [family, regime] of [
    ['multimer', { outerProductMeanFirst: true, positionScale: 20,
      chainAware: true, chainSequences: [CHAIN, CHAIN] }],
    ['monomer', {}],
  ]) {
    const model = await loadModel('msa', () => {}, undefined, family);
    const plddts = [];
    log(`${family}, 32:64, five seeds:`);
    for (const randomSeed of SEEDS) {
      const p = await new AlphaFoldUnifiedGpu(device).predictA3m(
        merged, model.weights, model.featureTables,
        { recycles: 0, randomSeed, maxMsaSequences: 32, maxExtraSequences: 64,
          chainLengths: LENGTHS, ...regime },
        model.paeBreaks);
      const c = p.final.confidence;
      plddts.push(c.meanPlddt);
      log(`  seed ${randomSeed}  pLDDT ${c.meanPlddt.toFixed(1).padStart(5)}  pTM ${c.ptm.toFixed(3)}  ipTM ${(c.iptm ?? NaN).toFixed(3)}`);
    }
    log(`  range ${Math.min(...plddts).toFixed(1)} - ${Math.max(...plddts).toFixed(1)}\n`);
  }
} catch (error) { log(`FAILED: ${error.message}`); log((error.stack ?? '').split('\n').slice(0,5).join('\n')); }
</script>
