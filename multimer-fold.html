<!doctype html><meta charset="utf-8"><title>first multimer fold</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * THE FIRST AF2-MULTIMER FOLD ON THIS GRAPH.
 *
 * Loads model-multimer/ - the export from tools/export_multimer_model.py -
 * through the same reader the monomer model uses, and runs it on the unified
 * graph in its MULTIMER regime: outer product mean first, position_scale 20,
 * chain identity on, and the template embedder running - which in multimer is
 * not a choice, it is added to the pair whether or not a template exists.
 *
 * The MSA pipeline is still the monomer's, so this is single-sequence. That is
 * the point: it isolates the graph and the weights from the feature work, so a
 * failure here is one of those two rather than all three.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);

const { getDevice } = await src('web/model.js');
const { HttpTensorStore } = await src('src/reference/http-tensor-store.js');
const { AlphaFoldFixture } = await src('src/reference/alphafold-fixture.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const { makeA3mFeatures } = await src('src/input/a3m-features.js');

const CHAIN = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const SEQUENCE = CHAIN + CHAIN;                 // homodimer
const CHAIN_LENGTHS = [CHAIN.length, CHAIN.length];

try {
  log('loading model-multimer/ …');
  const manifest = await fetch('./model-multimer/manifest.json').then((r) => r.json());
  const store = await HttpTensorStore.fromManifest('./model-multimer/', manifest);
  const fixture = AlphaFoldFixture.fromStore(store);
  const [embedding, templateEmbedding, extraStack, mainStack, structure, confidence, geometry,
    tables, paeBreaks] = await Promise.all([
      fixture.embeddingWeights(), fixture.templateEmbeddingWeights(),
      fixture.extraStackWeights(), fixture.mainStackWeights(),
      fixture.structureWeights(), fixture.confidenceWeights(), fixture.geometryTables(),
      fixture.queryOnlyFeatureTables(), fixture.tensor('confidencePaeBreaks'),
    ]);
  log(`  ${mainStack.length} main blocks, ${extraStack.length} extra blocks`);
  log(`  relative table ${embedding.relativePositionWeight.length / 128} rows`);

  // ...the shape web/model.js assembles: the confidence heads come apart into
  // lddt and pae, and `template` - the monomer's query-only residual - has no
  // multimer counterpart. `templateEmbedding` is multimer's own, and without it
  // here the embedder would be skipped and this harness would quietly measure
  // the graph that shattered backbones.
  const weights = { embedding, templateEmbedding, extraStack, mainStack, structure,
                    lddt: confidence.lddt, pae: confidence.pae, geometry };
  const device = await getDevice();
  // ...the A3M builder with a query-only alignment: this driver is the A3M one,
  // and its features carry msaSequences / extraSequences that the query-only
  // builder does not produce.
  const features = makeA3mFeatures(`>query\n${SEQUENCE}\n`, tables, {
    recycles: 0, chainLengths: CHAIN_LENGTHS,
  });
  log(`\nfolding ${SEQUENCE.length} residues as ${CHAIN_LENGTHS.join(':')} …`);
  const started = performance.now();
  const prediction = await new AlphaFoldUnifiedGpu(device).predict(
    features, weights, paeBreaks, undefined, undefined, {
      outerProductMeanFirst: true,
      positionScale: 20,
      chainAware: true,
      chainLengths: CHAIN_LENGTHS,
      chainSequences: [CHAIN, CHAIN],
    });
  const seconds = ((performance.now() - started) / 1000).toFixed(1);
  const final = prediction.final;
  log(`\ndone in ${seconds}s`);
  log(`  meanPlddt ${final.confidence.meanPlddt.toFixed(3)}`);
  log(`  ptm       ${final.confidence.ptm.toFixed(4)}`);
  if (final.confidence.iptm !== undefined) log(`  iptm      ${final.confidence.iptm.toFixed(4)}`);
  const atoms = final.structure.atom37;
  let finite = 0;
  for (let i = 0; i < atoms.length; i += 1) if (Number.isFinite(atoms[i])) finite += 1;
  log(`  atom37    ${finite}/${atoms.length} finite`);

  // WHAT THE PAE MATRIX ACTUALLY LOOKS LIKE, by block. A complex should read
  // low within each chain and higher between them; a PAE that is flat, or whose
  // blocks are the wrong way round, is the symptom of a confidence path fed the
  // wrong thing rather than of a bad prediction.
  const pae = final.confidence.predictedAlignedError;
  const L = CHAIN_LENGTHS[0] + CHAIN_LENGTHS[1];
  const stats = (fromI, toI, fromJ, toJ) => {
    let sum = 0, n = 0, lo = Infinity, hi = -Infinity;
    for (let i = fromI; i < toI; i += 1) for (let j = fromJ; j < toJ; j += 1) {
      const v = pae[i * L + j];
      sum += v; n += 1; lo = Math.min(lo, v); hi = Math.max(hi, v);
    }
    return { mean: sum / n, lo, hi };
  };
  const a = CHAIN_LENGTHS[0];
  const blocks = [
    ['A-A intra', stats(0, a, 0, a)],
    ['B-B intra', stats(a, L, a, L)],
    ['A-B inter', stats(0, a, a, L)],
    ['B-A inter', stats(a, L, 0, a)],
  ];
  log('');
  log(`  PAE, max bin ${final.confidence.maxPredictedAlignedError.toFixed(2)} A`);
  for (const [name, s] of blocks) {
    log(`    ${name}  mean ${s.mean.toFixed(2)}  min ${s.lo.toFixed(2)}  max ${s.hi.toFixed(2)}`);
  }
  const diagonal = Math.max(...[0, 1].map((k) => Math.abs(pae[k * L + k])));
  log(`    PAE on the diagonal (should be near zero): ${diagonal.toFixed(3)}`);
  log(`    symmetric A-B vs B-A: ${Math.abs(blocks[2][1].mean - blocks[3][1].mean) < 5 ? 'roughly' : 'NO - suspicious'}`);
  window.__MULTIMER__ = { meanPlddt: final.confidence.meanPlddt, ptm: final.confidence.ptm };
} catch (error) {
  log(`\nFAILED: ${error.message}`);
  log((error.stack ?? '').split('\n').slice(0, 6).join('\n'));
  window.__MULTIMER__ = { error: String(error) };
}
</script>
