# The localfold wheel: the native CUDA ports, prebuilt for every current NVIDIA card - no compiler needed to run them.
# Built by .github/workflows/wheel.yml (python/build_wheel.sh): the binaries are compiled into localfold/bin first.
[build-system]
requires = ["setuptools>=68", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "localfold"
version = "0.1.0"
description = "AlphaFold 3 (and its lineage), AlphaFold 2 and ESMFold2 as native CUDA binaries: a job JSON in, a structure out."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Beerware" }
authors = [{ name = "Sergey Ovchinnikov" }]
# cuBLAS is the one GPU library the binaries do not carry: NVIDIA's own wheel, found through each binary's RPATH
dependencies = ["nvidia-cublas-cu12>=12.8"]

[project.urls]
Homepage = "https://localfold.org"
Source = "https://github.com/sokrypton/localfold"

[project.scripts]
localfold-af3 = "localfold.cli:af3"
localfold-af2 = "localfold.cli:af2"
localfold-ef2 = "localfold.cli:ef2"
localfold-fetch = "localfold.cli:fetch"

[tool.setuptools]
packages = ["localfold"]

[tool.setuptools.package-data]
localfold = ["bin/localfold-*"]
