<!doctype html><meta charset="utf-8"><title>query-only vs A3M path</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * WHAT DOES THE SEPARATE SINGLE-SEQUENCE PATH ACTUALLY BUY?
 *
 * AlphaFoldQueryOnlyGpu exists as a speed specialisation: with one sequence the
 * extra-MSA stack has nothing to attend over, so it runs the pair-only block and
 * skips the MSA row/column attention and transition entirely.
 *
 * That saving is real, but it is a SECOND DRIVER, and it has now drifted three
 * times - it did not know the multimer regime, it did not get chainAware, and
 * options added to one were not added to the other. So the question is what the
 * specialisation costs to give up: the time, and whether the two agree.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);

const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldQueryOnlyGpu } = await src('src/model/query-only.js');
const { AlphaFoldMonomerGpu } = await src('src/model/monomer.js');

const SEQUENCE = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const RECYCLES = 0;

const compare = (name, a, b) => {
  let maxabs = 0;
  for (let i = 0; i < a.length; i += 1) maxabs = Math.max(maxabs, Math.abs(a[i] - b[i]));
  log(`  ${name.padEnd(8)} n=${String(a.length).padStart(6)}  maxabs ${maxabs.toExponential(3)}`);
  return maxabs;
};

try {
  const device = await getDevice();
  log('loading both weight sets (the paths ask for different extra stacks)…');
  const single = await loadModel('single', () => {});
  const msa = await loadModel('msa', () => {});

  // 🔴 INTERLEAVED, ORDER FLIPPED EACH REP. This machine drifts enough between
  // runs that one measurement each says nothing; alternating within a session
  // and reporting the median is the only way a difference this small is real.
  const runQueryOnly = () => new AlphaFoldQueryOnlyGpu(device).predictSequence(
    SEQUENCE, single.weights, single.featureTables,
    { recycles: RECYCLES, randomSeed: 0 }, single.paeBreaks);
  const runViaA3m = () => new AlphaFoldMonomerGpu(device).predictA3m(
    `>query\n${SEQUENCE}\n`, msa.weights, msa.featureTables,
    { recycles: RECYCLES, randomSeed: 0 }, msa.paeBreaks);

  const timed = async (run) => {
    const started = performance.now();
    const value = await run();
    return { seconds: (performance.now() - started) / 1000, value };
  };
  await timed(runQueryOnly);   // warm both pipelines before measuring
  await timed(runViaA3m);

  const times = { queryOnly: [], a3m: [] };
  let queryOnly, viaA3m;
  for (let rep = 0; rep < 5; rep += 1) {
    const order = rep % 2 === 0 ? ['queryOnly', 'a3m'] : ['a3m', 'queryOnly'];
    for (const which of order) {
      const result = await timed(which === 'queryOnly' ? runQueryOnly : runViaA3m);
      times[which].push(result.seconds);
      if (which === 'queryOnly') queryOnly = result.value; else viaA3m = result.value;
    }
  }
  const median = (xs) => [...xs].sort((a, b) => a - b)[Math.floor(xs.length / 2)];
  const queryOnlySeconds = median(times.queryOnly);
  const a3mSeconds = median(times.a3m);
  const spread = (xs) => `${Math.min(...xs).toFixed(2)}-${Math.max(...xs).toFixed(2)}`;

  log('');
  log(`query-only  median ${queryOnlySeconds.toFixed(2)}s  (${spread(times.queryOnly)})  pLDDT ${queryOnly.final.confidence.meanPlddt.toFixed(3)}`);
  log(`via A3M     median ${a3mSeconds.toFixed(2)}s  (${spread(times.a3m)})  pLDDT ${viaA3m.final.confidence.meanPlddt.toFixed(3)}`);
  log(`\nthe specialisation is ${(a3mSeconds / queryOnlySeconds).toFixed(2)}x the A3M path `
    + `on ${SEQUENCE.length} residues, over 5 interleaved reps`);
  log('');
  log('do they agree?');
  compare('atom37', viaA3m.final.structure.atom37, queryOnly.final.structure.atom37);
  compare('plddt', viaA3m.final.confidence.plddt, queryOnly.final.confidence.plddt);
  window.__PATHS__ = { queryOnlySeconds, a3mSeconds };
} catch (error) {
  log(`FAILED: ${error.message}`);
  log((error.stack ?? '').split('\n').slice(0, 5).join('\n'));
}
</script>
