<!doctype html><meta charset="utf-8"><title>regime ablation, 3 copies</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * Re-run the regime ablation now that the extra stack honours OPM-first.
 * The last one was taken while that was broken, so every arm was ~31 and it
 * said nothing. Three copies, where degradation is clear but a pass is 11s.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);
const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const { mergeChainA3ms } = await src('src/input/chains.js');
const CHAIN = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const COPIES = 3;
const chains = Array(COPIES).fill(CHAIN);
const lengths = chains.map((c) => c.length);
const FULL = { outerProductMeanFirst: true, positionScale: 20,
  chainAware: true, chainSequences: chains };
try {
  const device = await getDevice();
  const a3m = await fetch('/test.a3m').then((r) => r.text());
  const merged = mergeChainA3ms(Array(COPIES).fill(a3m));
  const model = await loadModel('msa', () => {}, undefined, 'multimer');
  const run = async (label, regime) => {
    const trail = [], tol = [];
    await new AlphaFoldUnifiedGpu(device).predictA3m(
      merged, model.weights, model.featureTables,
      { recycles: 3, randomSeed: 0, chainLengths: lengths,
        maxMsaSequences: 32, maxExtraSequences: 64, ...regime },
      model.paeBreaks,
      (r, recycle) => {
        trail.push((r.confidence.meanPlddt / 100).toFixed(3));
        if (recycle > 0) tol.push(r.recycleDistance.toFixed(1));
      });
    log(`  ${label.padEnd(30)} ${trail.join(' → ')}   tol ${tol.join(' ')}`);
  };
  log('3 copies, 32:64, plddt by recycle and the C-alpha tolerance:\n');
  await run('full multimer regime', FULL);
  await run('positionScale 10', { ...FULL, positionScale: 10 });
  await run('no outerProductMeanFirst', { ...FULL, outerProductMeanFirst: false });
  await run('no chainAware', { ...FULL, chainAware: false });
  await run('templates on (monomer mock)', { ...FULL, templates: undefined });
} catch (error) { log(`FAILED: ${error.message}`); log((error.stack ?? '').split('\n').slice(0,4).join('\n')); }
</script>
