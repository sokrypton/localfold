<!doctype html><meta charset="utf-8"><title>copies sweep</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * Does the prediction degrade as copies are added?
 *
 * The reference oscillates between a ~0.22 mode and a ~0.94 one, so a single
 * number proves nothing - but a MONOTONIC decline across recycles does, because
 * recycling should improve or bounce, never walk steadily downhill. Six copies
 * did exactly that: 0.223, 0.206, 0.177, 0.149, 0.147.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);
const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const { mergeChainA3ms } = await src('src/input/chains.js');
const CHAIN = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const RECYCLES = 3;
try {
  const device = await getDevice();
  const a3m = await fetch('/test.a3m').then((r) => r.text());
  const model = await loadModel('msa', () => {}, undefined, 'multimer');
  for (const copies of [1, 2, 3, 4]) {
    const chains = Array(copies).fill(CHAIN);
    const lengths = chains.map((c) => c.length);
    const merged = copies === 1 ? a3m : mergeChainA3ms(Array(copies).fill(a3m));
    const trail = [];
    await new AlphaFoldUnifiedGpu(device).predictA3m(
      merged, model.weights, model.featureTables,
      { recycles: RECYCLES, randomSeed: 0, chainLengths: lengths,
        maxMsaSequences: 32, maxExtraSequences: 64,
        outerProductMeanFirst: true, positionScale: 20, templates: false,
        chainAware: copies > 1, chainSequences: chains },
      model.paeBreaks,
      (result) => {
        const c = result.confidence;
        trail.push(`${(c.meanPlddt / 100).toFixed(3)}`);
      });
    log(`${copies} cop${copies === 1 ? 'y ' : 'ies'} (${copies * 59} res)  plddt by recycle: ${trail.join(' → ')}`
      + `  ${Number(trail.at(-1)) > Number(trail[0]) ? 'improving' : 'DECLINING'}`);
  }
} catch (error) { log(`FAILED: ${error.message}`); log((error.stack ?? '').split('\n').slice(0,5).join('\n')); }
</script>
