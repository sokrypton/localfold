<!doctype html><meta charset="utf-8"><title>MSA depth sweep</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/* Does a paired homodimer degrade gracefully as the MSA is subsampled? */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);

const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const { mergeChainA3ms } = await src('src/input/chains.js');
const { parseA3m } = await src('src/input/a3m.js');

const CHAIN = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const LENGTHS = [CHAIN.length, CHAIN.length];
const DEPTHS = [[508, 1024], [256, 512], [128, 256], [64, 128], [32, 64], [16, 32]];

try {
  const device = await getDevice();
  const a3m = await fetch('/test.a3m').then((r) => r.text());
  const merged = mergeChainA3ms([a3m, a3m]);
  log(`paired alignment: ${parseA3m(merged).depth} rows x ${parseA3m(merged).length} columns\n`);
  // ...and the monomer at the same depths. If both collapse it is the model
  // meeting a shallow alignment; if only multimer does, it is ours.
  const cases = [
    ['multimer', await loadModel('msa', () => {}, undefined, 'multimer'),
      { outerProductMeanFirst: true, positionScale: 20,
        chainAware: true, chainLengths: LENGTHS, chainSequences: [CHAIN, CHAIN] }],
    ['monomer', await loadModel('msa', () => {}, undefined, 'monomer'), { chainLengths: LENGTHS }],
    ['monomer, one chain', await loadModel('msa', () => {}, undefined, 'monomer'), { single: true }],
  ];
  for (const [name, model, regime] of cases) {
    const text = regime.single ? a3m : merged;
    const options = regime.single ? {} : regime;
    log(`\n${name}`);
    log('  clusters:extra    pLDDT    pTM    ipTM   depth kept');
    for (const [maxMsaSequences, maxExtraSequences] of DEPTHS) {
      const prediction = await new AlphaFoldUnifiedGpu(device).predictA3m(
        text, model.weights, model.featureTables,
        { recycles: 0, randomSeed: 0, maxMsaSequences, maxExtraSequences, ...options },
        model.paeBreaks);
      const c = prediction.final.confidence;
      log(`  ${String(maxMsaSequences).padStart(4)}:${String(maxExtraSequences).padEnd(6)}`
        + `  ${c.meanPlddt.toFixed(1).padStart(6)}  ${c.ptm.toFixed(3)}  ${(c.iptm ?? NaN).toFixed(3)}`);
    }
  }
} catch (error) {
  log(`FAILED: ${error.message}`);
  log((error.stack ?? '').split('\n').slice(0, 6).join('\n'));
}
</script>
