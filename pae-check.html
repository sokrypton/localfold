<!doctype html><meta charset="utf-8"><title>PAE, monomer vs multimer</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * IS THE MULTIMER CONFIDENCE PATH SELF-CONSISTENT?
 *
 * ipTM is derived from the same PAE logits the PAE matrix is, so the two cannot
 * disagree: a higher ipTM MUST come with a lower inter-chain PAE. Checking one
 * against the other catches a confidence path fed the wrong thing, which a
 * plausible-looking number on its own would not.
 *
 * Both models run on the SAME paired alignment, so only the weights differ.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);

const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const { makeA3mFeatures } = await src('src/input/a3m-features.js');
const { mergeChainA3ms } = await src('src/input/chains.js');

const CHAIN = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const LENGTHS = [CHAIN.length, CHAIN.length];
const L = LENGTHS[0] + LENGTHS[1];

const blockMean = (pae, fromI, toI, fromJ, toJ) => {
  let sum = 0, n = 0;
  for (let i = fromI; i < toI; i += 1) for (let j = fromJ; j < toJ; j += 1) { sum += pae[i * L + j]; n += 1; }
  return sum / n;
};

try {
  const device = await getDevice();
  log('building the paired homodimer alignment…');
  const a3m = await fetch('/test.a3m').then((r) => r.text());
  const merged = mergeChainA3ms([a3m, a3m]);
  log(`  ${(merged.match(/^>/gm) || []).length} rows, ${merged.split('\n')[1].length} columns\n`);

  for (const [family, regime] of [
    ['monomer', {}],
    ['multimer', { outerProductMeanFirst: true, positionScale: 20, templates: false,
      chainAware: true, chainSequences: [CHAIN, CHAIN] }],
  ]) {
    const model = await loadModel('msa', () => {}, undefined, family);
    const features = makeA3mFeatures(merged, model.featureTables, { recycles: 0, chainLengths: LENGTHS });
    const started = performance.now();
    const prediction = await new AlphaFoldUnifiedGpu(device).predict(
      features, model.weights, model.paeBreaks, undefined, undefined,
      { chainLengths: LENGTHS, ...regime });
    const c = prediction.final.confidence;
    const intra = (blockMean(c.predictedAlignedError, 0, 59, 0, 59)
      + blockMean(c.predictedAlignedError, 59, L, 59, L)) / 2;
    const inter = (blockMean(c.predictedAlignedError, 0, 59, 59, L)
      + blockMean(c.predictedAlignedError, 59, L, 0, 59)) / 2;
    log(`${family.padEnd(9)} ${((performance.now() - started) / 1000).toFixed(1)}s`);
    log(`  pLDDT ${c.meanPlddt.toFixed(1)}   pTM ${c.ptm.toFixed(3)}   ipTM ${(c.iptm ?? NaN).toFixed(3)}`);
    log(`  PAE intra ${intra.toFixed(2)} A   inter ${inter.toFixed(2)} A   gap ${(inter - intra).toFixed(2)}`);
    log('');
  }
  log('a higher ipTM must come with a LOWER inter-chain PAE - they read the same logits.');
} catch (error) {
  log(`FAILED: ${error.message}`);
  log((error.stack ?? '').split('\n').slice(0, 5).join('\n'));
}
</script>
