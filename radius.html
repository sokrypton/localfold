<!doctype html><meta charset="utf-8"><title>are our chains the right size?</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * HOW BIG IS ONE CHAIN?
 *
 * A folded 59-residue domain has a C-alpha radius of gyration around 10 A and a
 * furthest-atom radius around 13-15 A. Multi-copy folds came out with chain
 * radii of 21-28 A, which is not "slightly wrong" - it is roughly double, and
 * position_scale is exactly a factor of two between monomer (10) and multimer
 * (20). So: measure one chain, three ways, and compare against the monomer that
 * is known to fold this sequence correctly.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);
const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const CHAIN = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const ATOMS = 37, CA = 1, N = CHAIN.length;

function shape(atom37) {
  const ca = [];
  for (let r = 0; r < N; r += 1) {
    const b = (r * ATOMS + CA) * 3;
    ca.push([atom37[b], atom37[b + 1], atom37[b + 2]]);
  }
  const centre = [0, 1, 2].map((k) => ca.reduce((s, p) => s + p[k], 0) / N);
  const d = ca.map((p) => Math.hypot(...p.map((v, k) => v - centre[k])));
  const gyration = Math.sqrt(d.reduce((s, v) => s + v * v, 0) / N);
  // ...and the virtual bond: consecutive CA atoms sit 3.8 A apart in every
  // protein. It is the sharpest scale check there is, independent of folding.
  let bond = 0;
  for (let r = 1; r < N; r += 1) {
    bond += Math.hypot(...[0, 1, 2].map((k) => ca[r][k] - ca[r - 1][k]));
  }
  return { gyration, radius: Math.max(...d), bond: bond / (N - 1) };
}

try {
  const device = await getDevice();
  const a3m = await fetch('/test.a3m').then((r) => r.text());
  const monomer = await loadModel('msa', () => {}, undefined, 'monomer');
  const multimer = await loadModel('msa', () => {}, undefined, 'multimer');
  const run = async (label, model, regime) => {
    let last;
    await new AlphaFoldUnifiedGpu(device).predictA3m(
      a3m, model.weights, model.featureTables,
      { recycles: 0, randomSeed: 0, maxMsaSequences: 32, maxExtraSequences: 64, ...regime },
      model.paeBreaks, (r) => { last = r; });
    const s = shape(last.structure.atom37);
    log(`  ${label.padEnd(28)} plddt ${(last.confidence.meanPlddt / 100).toFixed(3)}`
      + `  Rg ${s.gyration.toFixed(1)}  Rmax ${s.radius.toFixed(1)}`
      + `  CA-CA ${s.bond.toFixed(2)} A`);
  };
  log('one chain, 59 residues. A real protein has CA-CA = 3.80 A.\n');
  await run('monomer weights', monomer, {});
  await run('multimer weights, scale 20', multimer, { outerProductMeanFirst: true, positionScale: 20 });
  await run('multimer weights, scale 10', multimer, { outerProductMeanFirst: true, positionScale: 10 });
} catch (error) { log(`FAILED: ${error.message}`); log((error.stack ?? '').split('\n').slice(0,4).join('\n')); }
</script>
