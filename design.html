<!--
design.html
-----------
AI Context: THE PROTEIN HUNTER PAGE (the design loop, not a fold)

🔴 THIS IS A SHELL. The controls, the feedback surfaces and the designer's
automatic choice are real; THE LOOP IS NOT WIRED. Pressing Hunt says so. See
docs/DESIGN.md for the plan, the upstreams and the order of work.

🔴 THE PAGE IS NOT LINKED FROM index.html AND NOTHING LINKS TO IT. It is in
tools/build_site.py's OPTIONAL list, so a clean checkout without it still
builds - but it IS copied when present, which means that once `main` is
deployed the URL exists. Unlinked is not hidden; say so rather than implying
otherwise.

🔴 WHY THIS PAGE CANNOT BE SHAPED LIKE index.html's. A fold is one action with
one answer, so that page can show a viewer and a score. A hunt is minutes of
nested work - runs, then cycles, then a fold and a design inside each cycle -
and an interface that only shows the final answer is the wrong shape for it. At
any instant this page has to answer three questions without being asked: what
is it doing now, what has it found so far, and why did it keep or reject the
last thing. Every surface below exists for one of those three.

The style IS index.html's: py2Dmol's light application CSS plus
web/localfold.css. Not web/style.css, the dark theme the withheld pages used.
-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Hunter</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./web/vendor/py2Dmol.app.css">
    <link rel="stylesheet" href="./web/localfold.css">
    <!-- Same reason as index.html: the app writes this on load and on every
         clear, so an inline script in the head is the one place guaranteed to
         run before the first of those. py2Dmol's default names controls this
         page does not have. -->
    <script>window.py2dmolReadyMessage = "Ready. Describe a target and press Hunt.";</script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans p-4">

    <div class="mx-auto page-width" style="position: relative;">

        <!-- 🔴 THE METHOD AND THE ACTIONS LIVE IN THE PAGE HEAD, NOT IN THE
             PANEL, and index.html's own note says why: with the buttons inside
             the input row, "every row was cut short by their column". This page
             learned it the hard way - the span list computed to 248px with the
             structure and preset controls beside it, so every row's fields
             wrapped into a column and the list read as rubble.

             Method sits here because it decides what every control below means,
             which is the one thing that should never be scrolled to. -->
        <div class="page-head page-head-fold" style="padding-right: 0;">
            <h1>LocalDesign</h1>
            <div class="fold-actions">
                <select id="method" class="entity-picker"
                    title="How the design is made. Protein Hunter folds and redesigns in a loop; RFD4-Proteina generates structure directly.">
                    <option value="hunter" selected>Protein Hunter</option>
                    <option value="rfd4p">RFD4-Proteina</option>
                </select>
                <!-- 🔴 BESIDE THE METHOD, AND FILTERED BY IT. An example is
                     where most readers start, so it belongs with the first
                     choice they make rather than at the far end of the
                     settings. And the list is RFD4-Proteina's: Protein Hunter
                     cannot run four of the ten, so offering those under Hunter
                     invites a click and then explains why it was wrong - the
                     same fault as a control that does nothing. The options are
                     rebuilt on every method change from
                     cpu/design/preset-methods.js. -->
                <select id="preset" class="entity-picker"
                    title="Load a worked example into the spans below.">
                    <option value="">Start from…</option>
                </select>
                <button type="button" id="add-span" class="btn btn-grey btn-small"
                    title="Add a span: residues to design, a chain you know, part of a loaded structure, a ligand, or a chain break.">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add span</span>
                </button>
                <button type="button" id="hunt" class="btn btn-primary">
                    <i class="fa-solid fa-dna"></i>
                    <span>Hunt</span>
                </button>
            </div>
        </div>

        <!-- ONE PANEL FOR THE WHOLE JOB, in index.html's shape: the thing being
             made on top, its settings in a single strip underneath. It was seven
             boxes - method, spans, structure, preset, designer, sampling,
             action - and seven boxes is a page with no hierarchy at all. -->
        <div id="design-panel" class="container-box page-width">
            <div class="fetch-panel">

                <!-- THE JOB, AS A LIST OF SPANS YOU ADD TO. Each row is a chain -
                     or part of one - and in the general case a CONTIG: an ordered
                     run of spans, some given and some to be made. That is
                     RFdiffusion's own notion and it describes Protein Hunter's
                     inputs too, which is why both methods share one editor
                     (docs/DESIGN.md section 5).

                     🔴 A SPAN HAS TWO AXES, GEOMETRY AND SEQUENCE, and every
                     modality is a combination of them: a target chain is
                     given/given, a binder generated/free, a motif given/given
                     inside a designed chain, inverse folding given geometry with
                     a free sequence. Those pairs ARE the residue roles.

                     🔴 WHAT DIFFERS PER METHOD IS WHICH SPANS ARE LEGAL, not what
                     a span is. A span the chosen method cannot honour says so on
                     the row rather than disappearing. -->
                <div class="fetch-row" id="design-input-container">
                    <div class="entity-list">
                        <div id="contig-rows"></div>
                    </div>
                </div>

                <!-- WHAT THE SPANS AMOUNT TO, in the notation the chosen method
                     is actually asked in - a contig for RFD4-Proteina, chains for
                     Protein Hunter, since a given SEQUENCE has no contig
                     notation. Anything wrong with the job is said beside it. -->
                <div class="design-summary">
                    <code id="contig-line"></code>
                    <div id="contig-problems" class="option-note"></div>
                </div>

                <!-- ...AND THE SETTINGS, in py2Dmol's own groups: a column each,
                     a rule between them, and a title saying which question the
                     column answers. One strip, not four boxes. -->
                <div class="fetch-options" id="designOptions">

                    <!-- 🔴 HIDDEN, AND STILL THE STATE. The automatic rule reads the
                         job and picks the checkpoint trained for it - LigandMPNN
                         where there are heteroatoms, NA-MPNN for a nucleic chain,
                         SolubleMPNN otherwise - and it was right in every case
                         measured (docs/DESIGN.md section 6). A picker whose
                         answer is already correct is a question nobody needs
                         asked, so the control goes and the ANSWER stays: the note
                         below the strip still names the checkpoint and why.

                         The <select> itself remains, at "auto", because it is
                         what web/hunt.js reads and what a driver can still set to
                         force a family by hand. -->
                    <div class="fetch-option-group" id="designerGroup" hidden>
                        <span class="fetch-option-title">Designer</span>
                        <select id="designer"
                            title="Which MPNN redesigns the binder each cycle. Auto reads the target and picks the checkpoint trained for it.">
                            <option value="auto" selected>Auto</option>
                            <option value="soluble">SolubleMPNN</option>
                            <option value="protein">ProteinMPNN</option>
                            <option value="ligand">LigandMPNN</option>
                            <option value="na">NA-MPNN</option>
                        </select>
                    </div>

                    <!-- 🔴 ONE FOLDING MODEL. It was a multi-select that rotated a
                         different model into each cycle - the measured win in
                         Yehlin's v2 - and the page is simpler asking one
                         question. web/hunt.js still takes a LIST and still
                         rotates it, so the capability is intact and untested
                         from here; what went is the control, not the code.

                         🔴 AND THE MODEL THAT FOLDS IS NOT THE MODEL THAT JUDGES.
                         A hunt's objective comes from the same fold that made the
                         design, which is a model scoring its own work; the
                         Validate control below is the independent check, and
                         Yehlin's own numbers are AF3-judged for exactly this
                         reason. -->
                    <div class="fetch-option-group" id="folderGroup">
                        <span class="fetch-option-title">Folds with</span>
                        <select id="folders"
                            title="Which model folds the sequence each cycle. Its confidence is the objective being optimised.">
                            <option value="af3" selected>AF3</option>
                            <option value="boltz2">Boltz-2</option>
                            <option value="protenix2">Protenix-2</option>
                            <option value="opendde">OpenDDE</option>
                        </select>
                    </div>

                    <!-- 🔴 THE INDEPENDENT CHECK, AND THE ONLY NUMBER THAT IS NOT
                         SELF-REPORTED. Protein Hunter optimises a model's opinion
                         of its own design; RFD4-Proteina generates a structure and
                         scores nothing at all. Folding the finished sequence with
                         a model that had no hand in making it gives a confidence
                         that was not optimised against, and an RMSD to the design
                         it was supposed to reproduce - which is the standard
                         self-consistency check. -->
                    <div class="fetch-option-group" id="validateGroup">
                        <span class="fetch-option-title">Validate with</span>
                        <select id="validate"
                            title="Fold the finished design again with a model that did not make it, and report its confidence and how far it moved.">
                            <!-- 🔴 EXACTLY THE KEYS OF `FOLDERS` IN
                                 web/validate-design.js. Boltz-2 and Protenix-2
                                 were offered here and are not in that map, so
                                 choosing either validated NOTHING and the run
                                 reported no number - a control that silently
                                 does nothing, which is worse than an absent
                                 one. test/design-validate-options.test.js holds
                                 this list against that map. -->
                            <option value="">nothing</option>
                            <option value="af3" selected>AF3</option>
                            <option value="openbind0">OpenBind-0</option>
                            <option value="opendde">OpenDDE</option>
                        </select>
                    </div>

                    <div class="fetch-option-group" id="cyclesGroup">
                        <span class="fetch-option-title">Cycles</span>
                        <input type="number" id="cycles" min="1" max="50" value="5"
                            title="How many fold-then-redesign rounds each run does.">
                    </div>

                    <!-- 🔴 HOW MANY SEQUENCES A CYCLE TRIES. One is the reference's
                         method: design once, fold it, carry it forward. More is a
                         beam - MPNN samples several sequences from the same
                         backbone, each is folded, and the best carries forward -
                         which explores more per cycle and costs that many folds.
                         The cost is linear and worth saying out loud. -->
                    <div class="fetch-option-group" id="beamGroup">
                        <span class="fetch-option-title">Sequences</span>
                        <input type="number" id="beam" min="1" max="16" value="1"
                            title="How many sequences MPNN samples per cycle. Each is folded and the best carries forward, so this multiplies the folds.">
                    </div>

                    <div class="fetch-option-group advanced" id="runsGroup">
                        <span class="fetch-option-title">Runs</span>
                        <input type="number" id="runs" min="1" max="100" value="1"
                            title="How many independent hunts to do, each from its own seed.">
                    </div>

                    <!-- 🔴 STEPS MEANS SOMETHING ON BOTH METHODS, and greying it
                         out on Protein Hunter was wrong: a fold has diffusion
                         steps too, they were simply never exposed and ran at the
                         sampler's own default of 25. RFD4-Proteina's are flow
                         steps. Same control, same question - how long to sample -
                         and the label says which. -->
                    <div class="fetch-option-group advanced" id="stepsGroup">
                        <span class="fetch-option-title" id="steps-title">Diffusion steps</span>
                        <input type="number" id="steps" min="4" max="400" value="25"
                            title="How many sampling steps each structure takes.">
                    </div>

                    <!-- The knobs that decide what the designer may write. The
                         field names follow maraxen/aminx's RunSpec, so a spec, a
                         script and this page mean the same thing by them. -->
                    <div class="fetch-option-group advanced" id="temperatureGroup">
                        <span class="fetch-option-title">Temperature</span>
                        <input type="number" id="temperature" min="0.01" max="2" step="0.01" value="0.1"
                            title="How sharply the designer samples. Low is conservative.">
                    </div>

                    <div class="fetch-option-group advanced" id="omitGroup">
                        <span class="fetch-option-title">Omit</span>
                        <input type="text" id="omit" value="C" maxlength="20"
                            title="Amino acid letters the designer may never write. Cysteine is omitted by default.">
                    </div>

                    <div class="fetch-option-group advanced" id="seedGroup">
                        <span class="fetch-option-title">Seed</span>
                        <input type="number" id="seed" min="0" value="0"
                            title="A given job, setting and seed give the same result every time.">
                    </div>

                    <!-- 🔴 THE STRUCTURE HALF THE MODALITIES ARE CONDITIONED ON. A
                         span taken From structure names residues of THIS; partial
                         diffusion starts the flow from it; inverse folding holds
                         its backbone. mmCIF, because RFD4's pipeline parses mmCIF
                         where web/template-source.js prefers PDB. -->
                    <div class="fetch-option-group" id="structureGroup">
                        <span class="fetch-option-title">Structure</span>
                        <div class="design-structure">
                            <input type="text" id="structure-id" placeholder="1PRW"
                                title="A PDB entry to take given segments from. Fetched as mmCIF from RCSB.">
                            <button type="button" id="load-structure" class="btn btn-grey btn-small">Load</button>
                            <input type="file" id="structure-file" accept=".cif,.mmcif,.cif.zst,.cif.gz,.bcif,.bcif.zst,.bcif.gz">
                            <label for="structure-file" class="btn btn-grey btn-small"
                                title="...or open an mmCIF from this computer.">Open file</label>
                        </div>
                    </div>

                    <!-- 🔴 ELEVEN CONTROLS IS NOT A SETTINGS STRIP, IT IS A FORM.
                         Five of them - runs, steps, temperature, omit, seed - are
                         tuning nobody changes on a first run, and they were
                         crowding the six that describe the job. They fold away
                         behind this, and the toggle says how many are behind it
                         rather than being an unlabelled chevron. -->
                    <div class="fetch-option-group" id="advancedGroup">
                        <span class="fetch-option-title">&nbsp;</span>
                        <button type="button" id="show-advanced" class="btn btn-grey btn-small"
                            aria-expanded="false"
                            title="Runs, sampling steps, temperature, omitted letters and the seed.">
                            5 more
                        </button>
                    </div>

                </div>

                <!-- 🔴 EVERYTHING THE PAGE DECIDED FOR YOU, IN ONE PLACE. The
                     designer it picked and why, the advice on how many folders to
                     rotate, what a loaded example asks for, what a structure gave
                     us. Each was a note hanging under its own control, which put
                     four ragged paragraphs through the middle of the settings;
                     collected here they read as one short column and the strip
                     stays a strip. -->
                <div class="design-notes">
                    <div id="unused-note" class="option-note"></div>
                    <div id="designer-note" class="option-note"></div>
                    <div id="folder-note" class="option-note"></div>
                    <div id="preset-note" class="option-note"></div>
                    <div id="structure-note" class="option-note"></div>
                </div>
            </div>
        </div>

        <!-- WHAT IT IS DOING NOW. The bar spans the WHOLE run rather than the
             current fold: one that restarts every cycle says nothing about how
             long is left. Always laid out, so nothing below it moves. -->
        <div id="status-row">
            <div id="status-line">
                <div id="status-message"></div>
            </div>
            <progress id="progress" max="1" value="0" data-state="idle"></progress>
            <div id="gpu-summary" class="option-note"></div>
        </div>

        <!-- EVERY CYCLE IS A FRAME OF ONE OBJECT, so the play bar walks the whole
             run and a design can be watched arriving rather than inspected
             afterwards. -->
        <div id="viewer-container" class="py2dmol-viewer-instance" style="display: none;"></div>

        <!-- 🔴 WHAT IS BEING DECIDED, AND WHAT IS NOT - the surface a fold page
             has no need of. The designed chain takes the free colour and every
             other chain the target one, the same swatches named here. Beside the
             results because that is where they are read, not at the foot of the
             page. -->
        <div id="results" class="container-box page-width" style="display: none;">
            <!-- 🔴 BUILT FROM THE SPANS, NOT WRITTEN OUT HERE. It used to list
                 five fixed roles, two of which - tied, motif - nothing painted:
                 a legend for a picture that did not exist. The colours are a
                 property of the JOB now (one per chain), so the only honest
                 place to build it is where the spans are read. -->
            <div id="roles-legend">
                <ul class="role-list" id="role-list"></ul>
            </div>

            <div id="cycle-track"></div>

            <!-- 🔴 A REJECTED CYCLE KEEPS ITS ROW AND ITS MEASUREMENT: "touches
                 0/4 hotspots (nearest 23.7 A, needs 8 A)". A model can run, score
                 itself well and produce the wrong molecule, so a page reporting
                 only the objective is a page that lies. -->
            <table id="results-table">
                <thead>
                    <tr>
                        <th>Run</th>
                        <th>Cycle</th>
                        <th>Folded by</th>
                        <th>Objective</th>
                        <th>Validity</th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>

        <div id="downloads" class="container-box page-width" style="display: none;"></div>

    </div>

    <!-- 🔴 py2Dmol ITSELF, WHICH web/viewer.js NEEDS ON `window`. Without these
         two the page runs a whole hunt, draws every row, and silently shows no
         structure - the viewer's registry simply stays empty, which is how this
         was found. index.html loads the same pair.

         `align` is separate because it cannot be concatenated: it starts its
         Worker by having the worker importScripts *itself*, found through
         document.currentScript.src, which inlining leaves empty. It is what
         superposes one cycle onto the next. -->
    <script src="./web/vendor/py2Dmol.align.js"></script>
    <script src="./web/vendor/py2Dmol.full.min.js"></script>
    <script type="module" src="./web/design.js"></script>

</body>

</html>
