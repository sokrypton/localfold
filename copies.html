<!doctype html><meta charset="utf-8"><title>copies x recycles</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * AGAINST A REAL AF2-MULTIMER RUN, 6 copies, seed 0, model_1_multimer_v3:
 *
 *   recycle 0  plddt 0.227  ptm 0.123  iptm 0.093  multi 0.099
 *   recycle 1  plddt 0.374  ptm 0.218  iptm 0.138  multi 0.154
 *   recycle 2  plddt 0.942  ptm 0.927  iptm 0.923  multi 0.924
 *   recycle 3  plddt 0.961  ptm 0.937  iptm 0.932  multi 0.933
 *   recycle 4  plddt 0.966  ptm 0.944  iptm 0.940  multi 0.941
 *
 * The reference is near-worthless until recycle 2 and then jumps. Every
 * measurement in this session so far was taken at recycle 0, which for a
 * complex is before the model has done anything - so the numbers said nothing
 * about whether the fold was right.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
const src = (path) => import(`./${path}${bust}`);
const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const { mergeChainA3ms } = await src('src/input/chains.js');

const COPIES = Number(new URLSearchParams(location.search).get('copies') ?? 6);
const RECYCLES = Number(new URLSearchParams(location.search).get('recycles') ?? 4);
const CHAIN = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const [MAX_MSA, MAX_EXTRA] = (new URLSearchParams(location.search).get('maxmsa') ?? '32:64')
  .split(':').map(Number);

try {
  const device = await getDevice();
  const a3m = await fetch('/test.a3m').then((r) => r.text());
  const chains = Array(COPIES).fill(CHAIN);
  const merged = mergeChainA3ms(Array(COPIES).fill(a3m));
  const lengths = chains.map((c) => c.length);
  log(`${COPIES} copies, ${lengths.reduce((a, b) => a + b, 0)} residues, ${RECYCLES} recycles, ${MAX_MSA}:${MAX_EXTRA}\n`);
  const model = await loadModel('msa', () => {}, undefined, 'multimer');
  const started = performance.now();
  // ...per pass AND cumulative. Reporting only the elapsed total made a flat
  // 112s/116s look like a runtime that grew with every recycle.
  let previous = started;
  await new AlphaFoldUnifiedGpu(device).predictA3m(
    merged, model.weights, model.featureTables,
    { recycles: RECYCLES, randomSeed: 0, chainLengths: lengths,
      maxMsaSequences: MAX_MSA, maxExtraSequences: MAX_EXTRA,
      outerProductMeanFirst: true, positionScale: 20, templates: false,
      chainAware: true, chainSequences: chains },
    model.paeBreaks,
    (result, recycle) => {
      const c = result.confidence;
      const multi = c.multimerScore ?? (0.8 * (c.iptm ?? 0) + 0.2 * c.ptm);
      log(`  recycle ${recycle}  plddt ${(c.meanPlddt / 100).toFixed(3)}`
        + `  ptm ${c.ptm.toFixed(3)}  iptm ${(c.iptm ?? NaN).toFixed(3)}`
        + `  multi ${multi.toFixed(3)}`
        + `  rmsd_tol ${result.recycleDistance === undefined ? 'n/a' : result.recycleDistance.toFixed(3)}`
        + `  ${((performance.now() - previous) / 1000).toFixed(0)}s this pass`
        + `, ${((performance.now() - started) / 1000).toFixed(0)}s total`);
      previous = performance.now();
    });
} catch (error) { log(`FAILED: ${error.message}`); log((error.stack ?? '').split('\n').slice(0,5).join('\n')); }
</script>
