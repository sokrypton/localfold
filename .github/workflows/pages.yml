name: Deploy WebGPU demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No node, no npm, no install step: the page loads src/**/*.js as written,
      # so assembling the site is a copy with an allow-list. python3 is already
      # on the runner.
      - name: Assemble the site
        run: python3 tools/build_site.py

      # GitHub Pages is public even when its source repository is private, so
      # the parameters ship only when the repository variable says so.
      - name: Add the single model-1 PTM release bundle
        if: ${{ vars.LOCALFOLD_INCLUDE_MODEL == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model1-ptm --pattern localfold-model1-ptm.tar.gz
          tar -xzf localfold-model1-ptm.tar.gz -C dist

      # 🔴 A SEPARATE BUNDLE AND A SEPARATE SWITCH. Multimer is another 98 MiB
      # on top of the monomer's 97, and the page loads whichever the fold asks
      # for, so a site can carry one, both, or neither. Without this the model
      # dropdown still offers Multimer - and Auto selects it for any sequence
      # with a ':' - which then fails on a manifest that was never deployed.
      - name: Add the multimer model-1 release bundle
        if: ${{ vars.LOCALFOLD_INCLUDE_MULTIMER_MODEL == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model1-multimer-v3 --pattern localfold-model1-multimer-v3.tar.gz
          tar -xzf localfold-model1-multimer-v3.tar.gz -C dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
