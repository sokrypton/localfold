<!doctype html><meta charset="utf-8"><title>monomer vs unified graph</title>
<body style="font:13px ui-monospace,Menlo,monospace;padding:16px"><pre id="out">running…</pre>
<script type="module">
/*
 * DOES THE UNIFIED GRAPH REPRODUCE THE MONOMER ONE, on the same weights?
 *
 * src/multimer/ widens the relative encoding to AF2-multimer's 73 rows, lets the
 * outer product mean run first, and takes position_scale as a parameter. With
 * all three in their monomer regime it should compute EXACTLY what
 * src/model/monomer.js computes - a single chain lights none of the eight chain
 * features, and those weight rows are zero anyway.
 *
 * That equivalence is what says the superset is right BEFORE any multimer weight
 * exists: hold it, and the remaining work is weights rather than graph. This
 * compares the tensors, not the rounded pLDDT the page prints, because a graph
 * bug can hide comfortably inside one decimal place.
 */
const out = document.getElementById('out');
out.textContent = '';
const log = (s) => { out.textContent += s + "\n"; };
const bust = `?v=${Date.now()}`;
// ...at the site root, not under tools/: the tensor store resolves ./model/
// against location.href, so a page one directory down asks for /tools/model/
// and 404s on the first shard.
const src = (path) => import(`./${path}${bust}`);

const { getDevice, loadModel } = await src('web/model.js');
const { AlphaFoldMonomerGpu } = await src('src/model/monomer.js');
const { AlphaFoldUnifiedGpu } = await src('src/multimer/model.js');
const { makeA3mFeatures } = await src('src/input/a3m-features.js');

const SEQUENCE = 'PIAQIHILEGRSDEQKETLIREVSEAISRSLDAPLTSVRVIITEMAKGHFGIGGELASK';
const RECYCLES = 0;   // the graphs differ per block, so one pass already shows it

log('loading weights…');
const device = await getDevice();
const model = await loadModel('msa', () => {});
log('building features…');
const a3m = `>query\n${SEQUENCE}\n`;
const features = makeA3mFeatures(a3m, model.featureTables, { recycles: RECYCLES, randomSeed: 0 });

const run = async (Graph, name, options = {}) => {
  const started = performance.now();
  const prediction = await new Graph(device).predict(
    features, model.weights, model.paeBreaks, undefined, undefined, options);
  const seconds = ((performance.now() - started) / 1000).toFixed(1);
  const final = prediction.final;
  log(`${name.padEnd(9)} ${seconds}s  meanPlddt ${final.confidence.meanPlddt.toFixed(6)}  ptm ${final.confidence.ptm.toFixed(6)}`);
  return final;
};

const compare = (name, a, b) => {
  if (a.length !== b.length) { log(`  ${name}: LENGTH ${a.length} vs ${b.length}`); return false; }
  let maxabs = 0, sumsq = 0, refsq = 0;
  for (let i = 0; i < a.length; i += 1) {
    const d = a[i] - b[i];
    maxabs = Math.max(maxabs, Math.abs(d));
    sumsq += d * d; refsq += b[i] * b[i];
  }
  const rel = Math.sqrt(sumsq / (refsq || 1));
  log(`  ${name.padEnd(10)} n=${String(a.length).padStart(7)}  maxabs ${maxabs.toExponential(3)}  relRMS ${rel.toExponential(3)}`);
  return maxabs === 0;
};

try {
  const monomer = await run(AlphaFoldMonomerGpu, 'monomer');
  const unified = await run(AlphaFoldUnifiedGpu, 'unified');
  log('');
  const exact = [
    compare('atom37', unified.structure.atom37, monomer.structure.atom37),
    compare('plddt', unified.confidence.plddt, monomer.confidence.plddt),
    compare('pae', unified.confidence.predictedAlignedError, monomer.confidence.predictedAlignedError),
  ];
  log('');
  log(exact.every(Boolean)
    ? 'BIT-EXACT: the unified graph reproduces the monomer graph.'
    : 'NOT bit-exact - see the numbers above.');

  // ...and the switches must actually reach something. A flag that changes
  // nothing reads exactly like a flag that is not wired, which has already
  // wasted a comparison once this project.
  log('');
  log('the switches, against the same weights (all SHOULD differ):');
  // a split of the one chain: not biology, just enough to light asym/entity/sym
  const halves = [30, SEQUENCE.length - 30];
  const variants = [
    ['opm first', { outerProductMeanFirst: true }],
    ['scale 20', { positionScale: 20 }],
    ['chain-aware', { chainAware: true, chainLengths: halves }],
  ];
  for (const [name, options] of variants) {
    try {
      const other = await new AlphaFoldUnifiedGpu(device).predict(
        features, model.weights, model.paeBreaks, undefined, undefined, options);
      let maxabs = 0;
      const a = other.final.structure.atom37, b = unified.structure.atom37;
      for (let i = 0; i < a.length; i += 1) maxabs = Math.max(maxabs, Math.abs(a[i] - b[i]));
      log(`  ${name.padEnd(12)} atom37 maxabs ${maxabs.toExponential(3)}  ${maxabs > 0 ? 'reaches the graph' : 'NO EFFECT - not wired?'}`);
    } catch (error) { log(`  ${name.padEnd(12)} FAILED: ${error.message}`); }
  }
  window.__AB__ = { exact: exact.every(Boolean) };
} catch (error) {
  log(`FAILED: ${error.message}`);
  log(error.stack ?? '');
  window.__AB__ = { error: String(error) };
}
</script>
